<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyncServer</title>
    <style>
      /* No stylesheet pipeline, for the same reason there is no framework: the console is
         thin, and a build step earns its place by removing work rather than by existing. */
      :root { color-scheme: light dark; --edge: #8884; }
      body {
        margin: 0; padding: 2rem 1.25rem; font: 15px/1.5 system-ui, sans-serif;
        max-width: 46rem; margin-inline: auto;
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
      .muted { opacity: 0.7; font-size: 0.9em; }
      .card { border: 1px solid var(--edge); border-radius: 10px; padding: 1rem; margin: 1rem 0; }
      label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9em; }
      input { width: 100%; padding: 0.5rem; border: 1px solid var(--edge); border-radius: 6px;
              background: transparent; color: inherit; font: inherit; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; border: 1px solid var(--edge);
               border-radius: 6px; background: transparent; color: inherit; font: inherit;
               cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .bad { color: #c0392b; }
      .ok { color: #1e8449; }

      /* Tables, because scanning is the ordinary act on both list screens and a stack of
         cards made the rare act — editing — the one the layout was built around. */
      table.rows { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1.5rem; }
      table.rows th {
        text-align: left; font-weight: 600; font-size: 0.85em; opacity: 0.6;
        padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--edge);
      }
      table.rows td { padding: 0.5rem 0.6rem 0.5rem 0; border-bottom: 1px solid var(--edge);
                      vertical-align: top; }
      /* The last column holds the row's actions and should take only what they need. */
      table.rows th:last-child, table.rows td:last-child { width: 1%; white-space: nowrap; text-align: right; }
      /* The editor a row opens: set apart, so it reads as belonging to the row above rather
         than as another row of the table. */
      tr.drawer > td { background: #8881; padding: 0.25rem 0.75rem 1rem; }

      /* An action inside a row is not a form's submit button, and should not look like one:
         no border, no top margin, no block of its own. */
      button.link {
        margin: 0; padding: 0; border: none; background: none; color: inherit;
        font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
      }
      button.link:hover { opacity: 0.75; }
    </style>
  </head>
  <body>
    <main id="app">Loading…</main>
    <script src="app.js"></script>
  </body>
</html>
