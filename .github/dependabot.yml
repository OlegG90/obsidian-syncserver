# Version updates. Security updates are a repository setting, not this file, and they arrive
# whenever an advisory does — neither the schedule nor the cooldown below delays them.
#
# **Docker is deliberately absent.** Every base image is pinned to a major and an Alpine release
# (`node:26-alpine3.23`, `postgres:18-alpine`), and Dependabot only offers tags with the same
# suffix — so all it could ever propose is the next major. For postgres that is a cluster the
# existing PGDATA cannot start (docs/13: `pg_upgrade`), and the `postgresql18-client` the runtime
# image carries is pinned to agree with it (docs/10, `check-compose.mjs`). Moving any of these is
# a migration somebody plans, not a pull request somebody merges.
version: 2
updates:
  # One lockfile at the root covers all four workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A release that is days old is the one a hijacked maintainer account publishes. The server
    # holds no key, but the plugin does — `@noble/*` is where a vault's encryption lives.
    cooldown:
      default-days: 7
    groups:
      # Majors stay one PR each: those are the ones that need reading.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types describe the runtime, and the runtime is Node 26 (`engines`, the Dockerfile,
      # CI). A newer major describes APIs the server cannot call.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
