# The suites, run where nobody has to remember to run them.
#
# Three jobs rather than one, because they fail for different reasons and the difference is
# worth seeing at a glance: the checks need no database, the server suite needs one, and the
# plugin's live suite needs its own — it starts a real server and talks to it over HTTP,
# which is the only thing that proves client, keys and server agree.
#
# **Each database job gets its own PostgreSQL.** They would otherwise share one, and the
# first to claim the seeded administrator would leave the second answering 503 to everything
# (AGENTS.md). Two services cost seconds; a shared one costs an afternoon of confusion.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Not a secret: this is a throwaway database inside the job. Set explicitly so the server
  # does not fall back to the development socket, which does not exist on a runner.
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  checks:
    name: types, versions, compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The console's own tests. They live in this job rather than the server one because
      # they need no database — the only judgement in that workspace is what a line under a
      # login says, and that is a pure function.
      - run: npm test --workspace @syncserver/console
      # One version across six manifests (D-111), and a compose file that still says what
      # docs/13 promises it says.
      - run: node checks/check-version.mjs
      - run: node checks/check-compose.mjs
      # Prose is load-bearing here, so a docblock that has drifted off its function is wrong
      # in the way a reader trusts rather than merely untidy (D-84).
      - run: node checks/check-docblocks.mjs
      # `D-N` is a decision and `#N` is a GitHub issue, which used to be one notation for both
      # until they collided outright — D-111 and D-114 through D-119 are issue numbers too.
      - run: node checks/check-citations.mjs
      # One workspace, one name, two things — how a second `OpenedVault` reached a release.
      - run: node checks/check-names.mjs

  # The runtime image is BUILT here, and the reason is `pg_dump`. The static check next door
  # only proves two numbers agree in two files; whether the pinned package actually exists in
  # the pinned Alpine release is a fact only a build knows, and learning it at `v*` tag time —
  # or on the NAS — is learning it too late. `postgresql18-client` is in Alpine 3.23 and not in
  # 3.22, which is exactly the kind of thing that moves.
  image:
    name: the runtime image, and the pg_dump in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build the runtime stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: syncserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pg_dump is present, and is the major the compose file runs
        run: |
          set -euo pipefail
          want=$(grep -oP 'image:\s*postgres:\K\d+' docker-compose.yml)
          got=$(docker run --rm --entrypoint pg_dump syncserver:ci --version | grep -oP '\d+' | head -1)
          echo "compose runs postgres $want; the image carries pg_dump $got"
          [ "$want" = "$got" ] || { echo "::error::pg_dump $got cannot back up postgres $want"; exit 1; }

  server:
    name: server + schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/syncserver_dev
      SERVER_SECRET: ci-only-server-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `createdb`, `dropdb` and `psql`: db-reset.sh applies schema.sql and tests.sql, and
      # those assertions are most of the rules this project has.
      #
      # **From PGDG, pinned to the major the service runs**, and that is not tidiness: `pg_dump`
      # refuses a server newer than itself (docs/10), and Ubuntu's own `postgresql-client` is
      # several majors behind the `postgres:18` above. With the distribution package the
      # tests that take a real dump SKIPPED, and the job went green without running the thing it
      # was added to prove.
      - name: a psql and pg_dump of the major this job runs
        run: |
          set -euo pipefail
          want=$(grep -oP 'image:\s*postgres:\K\d+' docker-compose.yml)
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc             https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]             https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-$want"
          pg_dump --version
      - run: npm ci
      - run: npm run db:reset
      - run: npm test --workspace @syncserver/server

  plugin:
    name: plugin against a real server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `test:live` resets `syncserver_plugin` and then starts the built server against it,
      # so this is the database both halves have to name.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/syncserver_plugin
      SERVER_SECRET: ci-only-server-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      # Argon2id at 64 MiB runs for real here (D-62). It is the one thing a live test may
      # never fake, so the suite is slow on purpose and the timeout allows for it.
      - run: npm run test:live
        timeout-minutes: 20
