# Publish a release: the server image to the container registry, and the plugin bundle to a
# GitHub release, from one version tag.
#
# This is the third answer to the platform trap that docs/13 opens with — "build on the
# target, or for the target's platform, or publish from CI and pull". The runners are
# x86-64, which is the platform the trap is about, so an image built here and pulled on
# the server cannot be built for the wrong architecture by accident.
#
# It fires on tags, not on every push to main: one image per released version, matching
# the single version across six manifests (D-111). Every run also tags by commit, so a
# running container can be traced to a build. The registry is GitHub's, and it is PUBLIC —
# the server pulls with no credential, which is the whole point of the choice (docs/13).
#
# **The tag carries no `v`, and that is BRAT's rule rather than a preference.** The plugin is
# installed by pointing BRAT at this repository; it reads `manifest.json` out of a release's
# assets, and Obsidian requires the release tag, the release name and the version inside that
# manifest to be the same string. A `v` on the front makes two of the three disagree. So the
# tag IS the version — which is also what D-111 has said since M2, now with one more file
# forced to agree with the other six.
name: publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

env:
  # GitHub's container registry, unauthenticated on the pull side because the image is
  # public. The image name is lowercased below: registry names must be, and the owner may
  # not be.
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # The tag IS the version. The owner is lowercased for the same reason the image name
      # is — GHCR names must be lowercase.
      #
      # **Refused unless the ref really is a version tag.** This step used to say the workflow
      # "fires only on `v*`, so a missing match means the tag was malformed" — while
      # `workflow_dispatch` sat three lines above as a second trigger. On that path
      # `GITHUB_REF` is `refs/heads/main`, the strip does nothing, and the run publishes
      # `syncserver:main`: a moving tag, which is exactly what choosing against `latest` was
      # about (docs/13). A release has to be a point somebody can go back to, so the version
      # comes from a tag or the run stops here.
      #
      # **And the tag has to agree with the manifests.** `check-version.mjs` pins six files to
      # each other on every push; nothing pinned them to the tag, so tagging without bumping
      # produced an image called one thing containing another. That is the same quiet failure
      # D-111 was opened about, one layer out, and it is one line to refuse.
      - name: metadata
        id: meta
        run: |
          case "$GITHUB_REF" in
            refs/tags/[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::publish needs a version tag like 0.5.0-b; $GITHUB_REF names no version to attach" && exit 1 ;;
          esac
          tag="${GITHUB_REF#refs/tags/}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag but the manifests say $declared — one version, or the release is named after code it does not contain"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/syncserver" >> "$GITHUB_OUTPUT"

      - name: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # The workflow token can publish to this repository's packages; nothing else is
          # asked of it. No long-lived secret lives in this repository.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The platform the trap is about: a server that pulls this image is whatever it
          # is, and this build is deliberately x86-64 so that it matches the most common
          # deployment and says so rather than hoping.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          # **The same cache `ci.yml` has, and this job had none** (#324). Every release rebuilt
          # from nothing — a full `npm ci` and both compilations — for a commit CI had already
          # built minutes earlier on the way to `main`. `mode=max` keeps the intermediate stages,
          # which is what makes the `deps` stage reusable rather than only the last layer.
          #
          # It cannot make a release stale: the cache is keyed on the layer inputs, so a changed
          # manifest or a changed source file misses it and rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The plugin half of the same release, which is how it is INSTALLED (docs/13).
  #
  # There is no plugin in the image and there never will be: the server holds no key, and the
  # plugin holds every one of them, so they are shipped to different places by different
  # people. Obsidian's own plugin list is not one of those places yet — that is a submission
  # with its own review — so the route is BRAT, which installs from a repository's releases.
  #
  # BRAT's contract is narrow and worth stating: it reads `manifest.json` out of the RELEASE
  # ASSETS, not the repository, and it skips anything GitHub marks as a prerelease unless the
  # person installing has turned that on. So the assets are the deliverable, and this release
  # is an ordinary one whatever the version string says about how finished it is.
  #
  # After the image, deliberately. A release is an announcement, and announcing a version
  # whose server could not be built would send somebody to install half of one.
  plugin:
    name: the plugin bundle, for BRAT
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `--out` rather than `--vault`: the same bundle, with the installation left out.
      - run: node plugin/esbuild.mjs --out dist/plugin

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The three strings Obsidian requires to be one string. The manifest was already
          # checked against the other five by `check-version.mjs` and against the tag by the
          # job above; this is the copy that actually ships, read back from the asset.
          shipped="$(node -p 'require("./dist/plugin/manifest.json").version')"
          if [ "$tag" != "$shipped" ]; then
            echo "::error::the bundled manifest says $shipped, not $tag — BRAT would install a version nobody released"
            exit 1
          fi
          gh release create "$tag" --title "$tag" --generate-notes             dist/plugin/main.js dist/plugin/manifest.json

      # **What `gh release create` returns is not what a client sees** (#391).
      #
      # 0.8.2 published with every job green and BRAT refused to install it: the two assets were
      # on the release and downloadable throughout, while GitHub's own listings reported the
      # release as having none. It repeated on 0.8.3, with no edit racing the create, so it is
      # not something this workflow does. BRAT reads a listing, so it saw a release with no
      # manifest and said so.
      #
      # Two questions, answered differently on purpose:
      #
      # - **Can a client fetch the manifest at all**, unauthenticated, at the URL it uses, and
      #   does it carry the version the tag promises? A no is a broken release and fails the job
      #   — publishing is the one act with no second chance, and the tag is already public.
      # - **Do the listings agree the assets are there?** A no is GitHub disagreeing with itself
      #   about a release that is otherwise fine. Failing on that would turn their inconsistency
      #   into our red build without making the release any more installable, so it warns — by
      #   name, with what each read returned, because somebody will meet this as "BRAT cannot
      #   install it" and the run is where the answer should already be waiting.
      - name: the release, as a client reads it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/manifest.json"
          published=2   # main.js and manifest.json — what the release above uploaded

          # Unauthenticated, exactly as BRAT fetches it: this job's token may be allowed things
          # the public is not, and what matters here is what somebody installing sees. The
          # retries cover the seconds a fresh asset takes to become fetchable, not the listing
          # problem below — that one outlives any wait worth putting in a build.
          if ! curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/manifest.json "$url"; then
            echo "::error::$url did not answer — $tag carries no manifest a client can fetch"
            exit 1
          fi
          shipped="$(node -p 'require("/tmp/manifest.json").version')"
          if [ "$tag" != "$shipped" ]; then
            echo "::error::$url serves version $shipped, not $tag — BRAT would install a version nobody released"
            exit 1
          fi
          echo "manifest.json fetched anonymously, version $shipped" >> "$GITHUB_STEP_SUMMARY"

          # The listings, given three minutes to agree with the download.
          by_tag=0
          listed=0
          for _ in $(seq 1 12); do
            by_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets | length' || echo 0)"
            listed="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].assets | length' || echo 0)"
            if [ "$by_tag" = "$published" ] && [ "$listed" = "$published" ]; then
              echo "every read lists its $published assets" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done

          echo "::warning::$tag is published and its files download, but GitHub lists $by_tag assets by tag and $listed in the release list, of $published. BRAT reads a listing, so it may refuse to install $tag until that settles (#391)."
          echo "⚠ assets not listed yet — by tag $by_tag, in the list $listed, of $published. BRAT may refuse $tag for now; the files themselves are fine." >> "$GITHUB_STEP_SUMMARY"
